<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tabroom Theme</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <div class="header">
      <span class="eyebrow">Tabroom</span>
      <span class="title">Theme</span>
    </div>

    <div class="section-label">Style</div>
    <div class="theme-grid">
      <label class="swatch-label">
        <input type="radio" name="theme" value="warm" id="t-warm" />
        <span class="swatch warm"></span>
        <span class="swatch-name">Warm</span>
      </label>
      <label class="swatch-label">
        <input type="radio" name="theme" value="cool" id="t-cool" />
        <span class="swatch cool"></span>
        <span class="swatch-name">Cool</span>
      </label>
      <label class="swatch-label">
        <input type="radio" name="theme" value="indigo" id="t-indigo" />
        <span class="swatch indigo"></span>
        <span class="swatch-name">Indigo</span>
      </label>
    </div>

    <label class="row">
      <span>Compact tables</span>
      <input id="compact" type="checkbox" />
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
